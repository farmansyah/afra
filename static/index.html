<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A.F.R.A – Article Finder & Research Assistant</title>
<link rel="icon" type="image/svg+xml" href="/static/logos/classic.svg" id="favicon">
<script>/* apply the saved theme before anything is drawn */
(function () { var t = "navy"; try { t = localStorage.getItem("rt_theme") || "navy"; } catch (e) {}
  if (t === "auto") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "navy";
  if (t !== "navy") document.documentElement.setAttribute("data-theme", t);
  var l = "classic"; try { l = localStorage.getItem("rt_logo") || "classic"; } catch (e) {}
  document.documentElement.setAttribute("data-logo", l);
  document.getElementById("favicon").href = "/static/logos/" + l + ".svg"; })();</script>
<link rel="apple-touch-icon" href="/static/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght,SOFT@9..144,400..700,0..100&family=DM+Serif+Display&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/static/style.css?v=19">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>

    <a href="#settings" data-view="settings"><i>⚙</i>Settings</a>

  <div class="side-foot" id="llmStatus"></div>
  <div class="side-copy">© danafarmansyah · crafted with <button class="heart dedi-heart" type="button" title="♥" aria-label="A little note">♥</button></div>
